<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ValidaSuper - Prevenção de Perdas</title>

  <!-- Tipografia Industrial Fluida -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Modular -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tables.css">

  <!-- CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/scanner.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

</head>
<body>

  <div class="app-viewport">
    
   <!-- Topbar Header -->
<header class="topbar">
  <div class="brand-title">ValidaSuper</div>
  
  <!-- Seletor Dinâmico de Loja -->
  <div id="store-selector-container" class="hidden">
    <select id="select-active-store" class="select-store-header"></select>
  </div>

  <div class="topbar-actions">
    <div style="display: flex; gap: 0.5rem; align-items: center;">
        <!-- Badge de Iniciais do Usuário (Abre Painel de Gestão) -->
        <button type="button" id="btn-user-avatar-badge" class="avatar-badge" onclick="window.openUserProfileModal()" title="Minha Conta & Gestão">
          <span id="user-initials">--</span>
        </button>
        </button>

        <button type="button" id="btn-toggle-theme" class="btn-icon" title="Alternar Tema">🌙</button>
        <button type="button" id="btn-logout" class="btn-icon" title="Sair">🚪</button>
      </div>
</header>

    <!-- Tela de Login e Cadastro de Loja -->
    <section id="login-screen" class="container">
      <div style="text-align: center; margin-top: 2rem; margin-bottom: 1.5rem;">
        <h1 style="font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--primary);">VALIDASUPER</h1>
        <p style="color: var(--text-muted);">Controle de Validades e Perdas Operacionais</p>
      </div>

      <!-- Form Login Padrão -->
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">E-mail Corporativo</label>
          <input type="email" id="login-email" required placeholder="operador@loja.com">
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">Entrar no Sistema</button>
        <button type="button" id="btn-show-register" class="btn btn-secondary" style="margin-top: 0.75rem;">
          👤 Criar Minha Conta
        </button>
      </form>

      <!-- Form Cadastro de Usuário (Inicia Oculto) -->
      <form id="form-register-user" class="hidden">
        <h3 style="font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 1rem; color: var(--primary);">CRIAR MINHA CONTA</h3>
        
        <div class="form-group">
          <label for="reg-user-name">Nome Completo</label>
          <input type="text" id="reg-user-name" required placeholder="Ex: Carlos Silva">
        </div>
        <div class="form-group">
          <label for="reg-user-email">E-mail Corporativo</label>
          <input type="email" id="reg-user-email" required placeholder="seuemail@loja.com">
        </div>
        <div class="form-group">
          <label for="reg-user-password">Senha de Acesso</label>
          <input type="password" id="reg-user-password" required placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" class="btn btn-primary">Criar Conta</button>
        <button type="button" id="btn-show-login" class="btn btn-secondary" style="margin-top: 0.75rem;">
          ← Voltar para o Login
        </button>
      </form>

      <!-- Botão para alternar exibição no form de login -->
      <!-- DICA: Altere o texto do botão do form-login de "Cadastrar Minha Loja" para "Criar Minha Conta" -->
    </section>

    <!-- Tela Principal do App -->
    <main id="app-screen" class="container hidden">
      
      <!-- Visor Informativo do Usuário -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">
            Olá, <strong id="display-user-name" style="color: var(--text-main);">Carregando...</strong>
          </span>
          <h3 id="display-store-name" style="font-family: var(--font-display); font-size: 1.3rem;">Loja --</h3>
        </div>
        
        <button id="btn-open-modal" class="btn btn-primary" style="width: auto; min-height: 44px; padding: 0 1rem;">
          + Cadastrar
        </button>
      </div>

      <!-- Barra de Ações / Exportação de Relatórios -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: flex-end;">
        <button id="btn-export-excel" class="btn btn-secondary" style="width: auto; padding: 0.5rem 0.8rem; font-size: 0.85rem;">
          📊 Exportar Excel
        </button>
        <button id="btn-export-pdf" class="btn btn-secondary" style="width: auto; padding: 0.5rem 0.8rem; font-size: 0.85rem;">
          📄 Gerar PDF
        </button>
      </div>

      <!-- Card Lista de Produtos -->
      <div id="product-card-container" class="product-card-list">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-item active" data-sector="validade">
        <span class="nav-icon">📅</span>
        <span>Validade</span>
      </button>
      <button class="nav-item" data-sector="vencidos">
        <span class="nav-icon">🚫</span>
        <span>Vencidos</span>
      </button>
      <button class="nav-item" data-sector="uso_loja">
        <span class="nav-icon">🏪</span>
        <span>Uso Loja</span>
      </button>
      <button class="nav-item" data-sector="avarias">
        <span class="nav-icon">📦</span>
        <span>Avarias</span>
      </button>
      <!-- Botão da Equipe com ID para controle de acesso -->
      <button id="nav-item-equipe" class="nav-item hidden" data-sector="equipe">
        <span class="nav-icon">👥</span>
        <span>Equipe</span>
      </button>
    </nav>

  </div>

  <!-- MODAL 1: LANÇAMENTO DE PRODUTO -->
  <div id="modal-entry" class="modal">
    <div class="modal-content">
      <div class="modal-drag-handle"></div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 id="modal-title" style="font-family: var(--font-display); font-size: 1.4rem;">NOVO LANÇAMENTO</h3>
        <button type="button" id="btn-close-modal" style="background:none; border:none; color:var(--text-muted); font-size: 1.5rem; cursor:pointer;">&times;</button>
      </div>

      <form id="form-entry">
        <input type="hidden" id="entry-sector" value="validade">
        <input type="hidden" id="entry-image-url">

        <!-- Visor Digital do EAN -->
        <div class="visor-produto">
          <div class="visor-header">CÓDIGO DE BARRAS / EAN</div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <input type="text" id="entry-ean" required placeholder="0000000000000" style="background:none; border:none; color:#4ade80; font-family:var(--font-mono); font-size:1.4rem; font-weight:700; width:100%; outline:none;">
            <button type="button" id="btn-toggle-camera" style="background:#1e293b; border:1px solid #334155; color:#fff; padding:0.5rem; border-radius:8px; font-size:1.2rem; cursor:pointer;">📷</button>
          </div>
        </div>

        <!-- Câmera do Scanner -->
        <div id="camera-container" class="hidden" style="position: relative; width: 100%; height: 200px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 1rem;">
          <video id="scanner-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
          <div style="position: absolute; inset: 20%; border: 2px dashed #ef4444; border-radius: 8px; pointer-events: none;"></div>
        </div>

        <!-- Preview do Produto Encontrado -->
        <div id="product-preview-box" class="hidden" style="display: flex; align-items: center; gap: 1rem; background: var(--surface-panel); padding: 0.75rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid var(--border);">
          <img id="preview-img" src="" alt="Foto" style="width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: #fff;">
          <div>
            <small style="color: var(--text-muted); display: block;">Produto Identificado:</small>
            <strong id="preview-title" style="font-size: 0.9rem; color: var(--text-main);">-</strong>
          </div>
        </div>

        <div class="form-group">
          <label for="entry-product-name">Nome do Produto</label>
          <input type="text" id="entry-product-name" required placeholder="Ex: Leite Integral 1L">
        </div>

        <div class="form-group">
          <label for="entry-price">Preço Atual (R$) *</label>
          <input type="number" id="entry-price" step="0.01" min="0.01" required placeholder="Ex: 5.90">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label for="entry-batch">Lote</label>
            <input type="text" id="entry-batch" required placeholder="Ex: L01">
          </div>
          <div class="form-group">
            <label for="entry-qty">Quantidade</label>
            <input type="number" id="entry-qty" min="1" required placeholder="10">
          </div>
        </div>

        <div id="field-group-validity" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label for="entry-expiration">Vencimento</label>
            <input type="date" id="entry-expiration">
          </div>
          <div class="form-group">
            <label for="entry-location">Local</label>
            <select id="entry-location">
              <option value="Gôndola">Gôndola</option>
              <option value="Depósito">Depósito</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Confirmar Lançamento</button>
      </form>
    </div>
  </div>

  <!-- MODAL 2: CADASTRO DE COLABORADOR (INDEPENDENTE) -->
  <div id="modal-employee" class="modal">
    <div class="modal-content">
      <div class="modal-drag-handle"></div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="font-family: var(--font-display); font-size: 1.4rem;">CADASTRAR COLABORADOR</h3>
        <button type="button" id="btn-close-modal-emp" style="background:none; border:none; color:var(--text-muted); font-size: 1.5rem; cursor:pointer;">&times;</button>
      </div>

      <form id="form-employee">
        <div class="form-group">
          <label for="emp-name">Nome Completo</label>
          <input type="text" id="emp-name" required placeholder="Ex: João Souza">
        </div>

       <!-- Modal Gestão de Unidade / Loja (Criar ou Editar) -->
  <div id="modal-store-manage" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-store-title" class="modal-title">GESTÃO DE UNIDADE / LOJA</h3>
        <button type="button" id="btn-close-modal-store" class="btn-close">&times;</button>
      </div>
      <form id="form-store-manage">
        <input type="hidden" id="store-manage-id">
        <div class="form-group">
          <label for="store-manage-name">Nome do Supermercado / Loja</label>
          <input type="text" id="store-manage-name" required placeholder="Ex: Supermercado Centro">
        </div>
        <div class="form-group">
          <label for="store-manage-cnpj">CNPJ</label>
          <input type="text" id="store-manage-cnpj" placeholder="00.000.000/0001-00">
        </div>
        <button type="submit" id="btn-submit-store" class="btn btn-primary">Salvar Loja</button>
      </form>
    </div>
  </div>

  <!-- Modal Editar Usuário / Colaborador (Equipe) -->
  <div id="modal-edit-user" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">EDITAR COLABORADOR</h3>
        <button type="button" class="btn-close" onclick="closeAllModals()">&times;</button>
      </div>
      <form id="form-edit-user">
        <input type="hidden" id="edit-user-id">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="edit-user-name" style="display:block; margin-bottom:0.25rem;">Nome Completo</label>
          <input type="text" id="edit-user-name" required style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="edit-user-role" style="display:block; margin-bottom:0.25rem;">Função / Cargo</label>
          <select id="edit-user-role" required style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
            <option value="operador">Operador / Repositor</option>
            <option value="gerente">Gerente de Setor</option>
            <option value="precificacao">Setor de Precificação</option>
            <option value="adm">ADM / Auditoria</option>
            <option value="administrador">Administrador</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; margin-top: 0.5rem;">Salvar Alterações</button>
      </form>
    </div>
  </div>

  <!-- Modal Cadastrar Colaborador (Equipe) -->
  <div id="modal-employee" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">CADASTRAR COLABORADOR</h3>
        <button type="button" class="btn-close" onclick="closeAllModals()">&times;</button>
      </div>
      <form id="form-employee">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="emp-name" style="display:block; margin-bottom:0.25rem;">Nome Completo</label>
          <input type="text" id="emp-name" required placeholder="Ex: João da Silva" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="emp-role" style="display:block; margin-bottom:0.25rem;">Função / Perfil</label>
          <select id="emp-role" required style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
            <option value="operador">Operador / Repositor</option>
            <option value="gerente">Gerente de Setor</option>
            <option value="precificacao">Setor de Precificação</option>
            <option value="adm">ADM / Auditoria</option>
            <option value="administrador">Administrador</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="emp-email" style="display:block; margin-bottom:0.25rem;">E-mail de Acesso</label>
          <input type="email" id="emp-email" required placeholder="colaborador@loja.com" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="emp-avatar" style="display:block; margin-bottom:0.25rem;">URL da Foto (Opcional)</label>
          <input type="url" id="emp-avatar" placeholder="https://exemplo.com/foto.jpg" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; margin-top: 0.5rem;">Salvar Colaborador</button>
      </form>
    </div>
  </div>

  <!-- Modal Unificado de Perfil e Gestão de Lojas -->
  <div id="modal-user-profile" class="modal">
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title">MINHA CONTA & GESTÃO</h3>
        <button type="button" class="btn-close" onclick="closeAllModals()">&times;</button>
      </div>

      <!-- Abas Internas -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">
        <button type="button" id="tab-btn-meu-perfil" class="btn btn-secondary" style="flex:1; font-size:0.8rem;">👤 Meu Perfil</button>
        <button type="button" id="tab-btn-gestao-loja" class="btn btn-secondary" style="flex:1; font-size:0.8rem;">🏬 Editar Loja</button>
        <button type="button" id="tab-btn-nova-loja" class="btn btn-secondary" style="flex:1; font-size:0.8rem;">➕ Nova Loja</button>
      </div>

      <!-- SEÇÃO 1: Editar Próprio Usuário -->
      <form id="form-edit-self-profile">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="self-name" style="display:block; margin-bottom:0.25rem;">Nome Completo</label>
          <input type="text" id="self-name" required style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="self-role" style="display:block; margin-bottom:0.25rem;">Função Atual</label>
          <input type="text" id="self-role" disabled style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); opacity: 0.7; background: rgba(0,0,0,0.05);">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">Salvar Meu Nome</button>
      </form>

      <!-- SEÇÃO 2: Editar Loja Atual -->
      <form id="form-manage-current-store" class="hidden">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="profile-store-name" style="display:block; margin-bottom:0.25rem;">Nome da Unidade / Loja</label>
          <input type="text" id="profile-store-name" required style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="profile-store-cnpj" style="display:block; margin-bottom:0.25rem;">CNPJ</label>
          <input type="text" id="profile-store-cnpj" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">Atualizar Dados da Loja</button>
      </form>

      <!-- SEÇÃO 3: Criar Nova Loja -->
      <form id="form-create-new-store" class="hidden">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="new-store-name" style="display:block; margin-bottom:0.25rem;">Nome do Novo Supermercado</label>
          <input type="text" id="new-store-name" required placeholder="Ex: Filial Bairro Novo" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="new-store-cnpj" style="display:block; margin-bottom:0.25rem;">CNPJ (Opcional)</label>
          <input type="text" id="new-store-cnpj" placeholder="00.000.000/0001-00" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border);">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">Criar Nova Unidade</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
